name: way2ml 
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3
  - sphinx
  - numpy
  - matplotlib
  - pandas
  - ase
  - pip
  - pip:
      - furo
      - myst-parser
      - snakemake
      - scikit-image
      - pydata-sphinx-theme
      - sphinx-tabs
      - sphinx-copybutton
      - sphinx-design
      - sphinxcontrib.bibtex
      - git+https://github.com/HuangJiaLian/sphinx-molview.git
